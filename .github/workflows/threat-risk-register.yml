name: Threat risk register

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: threat-risk-register-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TRIVY_VERSION: "0.76.2"
  GITLEAKS_VERSION: "8.30.1"

jobs:

  # =========================================================
  # SCAN + THREAT MODEL
  # =========================================================

  threat-model:
    name: Scan and generate risk register

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: security/threat-model/requirements.txt

      - name: Install threat-model dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --upgrade \
            pip

          python -m pip install \
            -r security/threat-model/requirements.txt

          python -m pip install \
            semgrep

      - name: Verify Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import openpyxl
          import requests
          import yaml

          print(
              "openpyxl:",
              openpyxl.__version__
          )

          print(
              "requests:",
              requests.__version__
          )

          print(
              "PyYAML:",
              yaml.__version__
          )
          PY

          semgrep --version

      # =====================================================
      # TRIVY
      # =====================================================

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: true

      - name: Verify Trivy
        shell: bash
        run: |
          set -euo pipefail

          trivy --version

      # =====================================================
      # GITLEAKS
      # =====================================================

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_NAME="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE_NAME}" \
            --output "${RUNNER_TEMP}/${ARCHIVE_NAME}"

          tar \
            -xzf "${RUNNER_TEMP}/${ARCHIVE_NAME}" \
            -C "${RUNNER_TEMP}" \
            gitleaks

          install \
            -m 0755 \
            "${RUNNER_TEMP}/gitleaks" \
            "/usr/local/bin/gitleaks"

          gitleaks version

      # =====================================================
      # THREAT MODEL VALIDATION
      # =====================================================

      - name: Compile threat-model Python files
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall \
            security/threat-model

      - name: Verify scanner executables
        shell: bash
        run: |
          set -euo pipefail

          command -v python
          command -v semgrep
          command -v trivy
          command -v gitleaks

      # =====================================================
      # PULL REQUEST THREAT MODEL
      #
      # No Azure OpenAI secrets are supplied to pull requests.
      # =====================================================

      - name: Run threat model for pull request
        id: threat_model_pr
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          python security/threat-model/run.py

      # =====================================================
      # TRUSTED MASTER / MANUAL THREAT MODEL
      #
      # Azure OpenAI secrets are supplied only to trusted
      # master/manual execution.
      # =====================================================

      - name: Run threat model for trusted branch
        id: threat_model_trusted
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          set -euo pipefail

          python security/threat-model/run.py

      # =====================================================
      # SUMMARY
      # =====================================================

      - name: Add threat-model workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "${{ github.event_name }}" \
            > /tmp/event-name

          python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path(
              ".threat-model/summary.json"
          )

          if summary_path.exists():
              summary = json.loads(
                  summary_path.read_text(
                      encoding="utf-8"
                  )
              )
          else:
              summary = {}

          event_name = (
              Path("/tmp/event-name")
              .read_text(
                  encoding="utf-8"
              )
              .strip()
          )

          total_active = summary.get(
              "totalActive",
              0,
          )

          scanner_risks = summary.get(
              "scannerRisks",
              0,
          )

          architectural_risks = summary.get(
              "architecturalRisks",
              0,
          )

          new_critical = len(
              summary.get(
                  "newCritical",
                  [],
              )
          )

          severity_increased = len(
              summary.get(
                  "severityIncreased",
                  [],
              )
          )

          high_confidence_secret = (
              summary.get(
                  "highConfidenceSecret",
                  False,
              )
          )

          workbook = summary.get(
              "workbook",
              "not generated",
          )

          lines = [
              "# Threat risk register",
              "",
              "## Results",
              "",
              (
                  "- Total active risks: "
                  f"{total_active}"
              ),
              (
                  "- Scanner-generated risks: "
                  f"{scanner_risks}"
              ),
              (
                  "- Architectural risks: "
                  f"{architectural_risks}"
              ),
              (
                  "- New Critical risks: "
                  f"{new_critical}"
              ),
              (
                  "- Severity increases: "
                  f"{severity_increased}"
              ),
              (
                  "- High-confidence secret: "
                  f"{high_confidence_secret}"
              ),
              (
                  "- Workbook: "
                  f"`{workbook}`"
              ),
              "",
              "## Execution context",
              "",
              f"- Event: `{event_name}`",
              (
                  "- Pull-request jobs use "
                  "read-only repository permissions."
              ),
              (
                  "- Azure OpenAI secrets are not "
                  "provided to pull-request execution."
              ),
              (
                  "- Workbook commits occur only "
                  "after trusted master pushes."
              ),
              (
                  "- External GitHub Actions are "
                  "pinned to immutable commit SHAs."
              ),
          ]

          Path(
              "/tmp/threat-model-summary.md"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

          cat /tmp/threat-model-summary.md \
            >> "$GITHUB_STEP_SUMMARY"

      # =====================================================
      # ARTIFACTS
      # =====================================================

      - name: Upload threat-model artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threat-risk-register-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          path: |
            docs/security/Threat-Risk-Register.xlsx
            .threat-model/summary.json
            .threat-model/scan-results/semgrep.json
            .threat-model/scan-results/trivy.json
            .threat-model/scan-results/gitleaks.json

      # =====================================================
      # SECURITY GATES
      # =====================================================

      - name: Enforce pull-request security gate
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.threat_model_pr.outcome == 'failure'
        shell: bash
        run: |
          echo "Threat-model security gate failed for the pull request."
          exit 1

      - name: Enforce trusted-branch security gate
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          steps.threat_model_trusted.outcome == 'failure'
        shell: bash
        run: |
          echo "Threat-model security gate failed for the trusted branch."
          exit 1

  # =========================================================
  # COMMIT UPDATED WORKBOOK
  #
  # Never executes for a pull request.
  # This is the only job granted contents: write.
  # =========================================================

  commit-register:
    name: Commit updated risk register

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    needs:
      - threat-model

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write

    steps:

      # =====================================================
      # TRUSTED CHECKOUT
      # =====================================================

      - name: Check out trusted master branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: true

      # =====================================================
      # PYTHON FOR WORKBOOK VALIDATION
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install workbook validation dependency
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            openpyxl==3.1.5

      # =====================================================
      # DOWNLOAD GENERATED REGISTER
      # =====================================================

      - name: Download generated risk register
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: threat-risk-register-${{ github.run_id }}
          path: .

      # =====================================================
      # VERIFY WORKBOOK
      # =====================================================

      - name: Verify generated workbook
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            docs/security/Threat-Risk-Register.xlsx

          test -s \
            docs/security/Threat-Risk-Register.xlsx

          python - <<'PY'
          from openpyxl import load_workbook

          path = (
              "docs/security/"
              "Threat-Risk-Register.xlsx"
          )

          workbook = load_workbook(
              path,
              read_only=True,
              data_only=True,
          )

          if (
              "Risk Register"
              not in workbook.sheetnames
          ):
              raise SystemExit(
                  "Risk Register worksheet is missing."
              )

          worksheet = workbook[
              "Risk Register"
          ]

          expected_headers = {
              "Risk ID",
              "Fingerprint",
              "Status",
              "Component",
              "Service",
              "Source File",
              "Evidence",
              "Scanner",
              "Scanner Rule",
              "STRIDE Category",
              "Threat Scenario",
              "Existing Controls",
              "Recommended Mitigation",
              "Risk Score",
              "Severity",
              "Confidence",
          }

          headers = {
              cell.value
              for cell in worksheet[1]
              if cell.value
          }

          missing = (
              expected_headers
              - headers
          )

          if missing:
              raise SystemExit(
                  "Workbook is missing headers: "
                  + ", ".join(
                      sorted(missing)
                  )
              )

          risk_count = max(
              0,
              worksheet.max_row - 1,
          )

          print(
              "Workbook validation passed."
          )

          print(
              "Risk rows:",
              risk_count,
          )
          PY

      # =====================================================
      # COMMIT WORKBOOK ONLY
      # =====================================================

      - name: Commit updated workbook
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/security/Threat-Risk-Register.xlsx

          if git diff --cached --quiet
          then
            echo "Risk register has no changes."
            exit 0
          fi

          git commit \
            -m "security: update automated threat risk register [skip ci]"

          git push \
            origin \
            HEAD:master